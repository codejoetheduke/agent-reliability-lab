name: Verify and build desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    env:
      LAB_CREDENTIALS_FILE: ''
      LAB_DEFAULT_PROVIDER: mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          node scripts/python.mjs -m pip install -r apps/backend/requirements-dev.lock
          node scripts/python.mjs -m pip install --no-deps -e apps/backend
          npm ci
      - name: Backend tests and lint
        run: |
          npm run test:backend
          node scripts/python.mjs -m ruff check apps/backend scripts/backend-entry.py
          node scripts/python.mjs -m ruff format --check apps/backend scripts/backend-entry.py
          node scripts/python.mjs -m pip check
      - name: Frontend contracts, lint, and tests
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run test:tooling
          npm run check:source
      - name: Real-service browser workflows
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Frontend production build
        run: npm run build
  desktop:
    name: Installer (${{ matrix.target }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
    env:
      LAB_CREDENTIALS_FILE: ''
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.89.0'
          components: rustfmt,clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
      - name: Install locked build dependencies
        run: |
          python -m venv .venv
          node scripts/python.mjs -m pip install -r apps/backend/requirements-dev.lock -r apps/backend/requirements-build.lock
          node scripts/python.mjs -m pip install --no-build-isolation --no-deps -e apps/backend
          npm ci
      - name: Freeze and verify bundled Python
        run: |
          npm run package:backend
          npm run test:sidecar
      - name: Rust formatting and lint
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build native installers
        run: node scripts/native.mjs build --bundles ${{ matrix.bundles }}
      - name: Verify macOS sidecar after bundle signing
        if: runner.os == 'macOS'
        run: node scripts/smoke-macos-bundle.mjs
      - name: Collect installers and checksums
        run: node scripts/collect-release.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: .local/release-assets/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 3
